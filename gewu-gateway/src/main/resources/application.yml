server:
  port: 8080

spring:
  application:
    name: gewu-gateway
  main:
    web-application-type: reactive
  cloud:
    circuitbreaker:
      resilience4j:
        # 关闭默认 1s TimeLimiter：SSE 流式与分钟级 LLM 推理请求必须放行，
        # 否则全部被掐断转 17002 且计入失败率加速熔断开门（S8 部署实测发现）
        disable-time-limiter: true
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin
      routes:
        - id: gewu-sandbox
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/sandboxes/**,/api/v1/sandbox-audits/**
        - id: gewu-interface
          uri: http://localhost:8081
          predicates:
            - Path=/api/**
          filters:
            - name: CircuitBreaker
              args:
                name: interfaceCB
                fallbackUri: forward:/fallback
      discovery:
        locator:
          enabled: false
  data:
    redis:
      host: localhost
      port: 6379

gewu:
  gateway:
    jwt:
      secret: gewu-platform-jwt-secret-key-must-be-at-least-256-bits-long-for-hs256
      # 注意：网关按前缀匹配（startsWith），分享路径用前缀而非通配符
      skip-paths: /api/v1/auth/login,/api/v1/auth/register,/api/v1/auth/refresh,/api/v1/share/
    rate-limit:
      permits: 100
      timeout-seconds: 60

resilience4j:
  circuitbreaker:
    instances:
      interfaceCB:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        sliding-window-size: 10
        sliding-window-type: COUNT_BASED
        permitted-number-of-calls-in-half-open-state: 5
        # S8 补齐：小窗口下的生效门槛与慢调用/半开治理
        minimum-number-of-calls: 20
        slow-call-duration-threshold: 30s
        slow-call-rate-threshold: 80
        automatic-transition-from-open-to-half-open: true

logging:
  level:
    com.gewu.gateway: DEBUG
    org.springframework.cloud.gateway: INFO