server:
  port: 8080

spring:
  application:
    name: gewu-gateway
  main:
    web-application-type: reactive
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin
      routes:
        - id: gewu-sandbox
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/sandboxes/**,/api/v1/sandbox-audits/**
        - id: gewu-interface
          uri: http://localhost:8081
          predicates:
            - Path=/api/**
          filters:
            - name: CircuitBreaker
              args:
                name: interfaceCB
                fallbackUri: forward:/fallback
      discovery:
        locator:
          enabled: false
  data:
    redis:
      host: localhost
      port: 6379

gewu:
  gateway:
    jwt:
      secret: gewu-platform-jwt-secret-key-must-be-at-least-256-bits-long-for-hs256
      # 注意：网关按前缀匹配（startsWith），分享路径用前缀而非通配符
      skip-paths: /api/v1/auth/login,/api/v1/auth/register,/api/v1/auth/refresh,/api/v1/share/
    rate-limit:
      permits: 100
      timeout-seconds: 60

resilience4j:
  circuitbreaker:
    instances:
      interfaceCB:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        sliding-window-size: 10
        sliding-window-type: COUNT_BASED
        permitted-number-of-calls-in-half-open-state: 5

logging:
  level:
    com.gewu.gateway: DEBUG
    org.springframework.cloud.gateway: INFO