# 格物平台 - 生产环境配置

server:
  port: 8080
  tomcat:
    # S8：清理 Boot 2.3 起失效的旧键（max-threads/min-spare-threads），
    # threads.max 才是生效属性；补 access log 取证
    accept-count: 100
    connection-timeout: 10000
    max-connections: 8192
    keep-alive-timeout: 30000
    accesslog:
      enabled: true
      directory: /home/wnn/devcode/ai-code/gewu-platform/logs
      prefix: access
      suffix: .log
      pattern: "%h %t \"%r\" %s %b %D %F"
    threads:
      max: 200
      min-spare: 20

spring:
  profiles:
    active: prod

  # 异步请求超时配置 - SSE 流式对话需要足够长的超时
  # 推理模型（LongCat-2.0、DeepSeek-R1）的推理过程可能持续数分钟
  # 默认 Tomcat 30s 超时会导致流式响应被截断后一次性 flush
  mvc:
    async:
      # 30 分钟：马拉松生成（深度思考 + 截断重试最多 3 次翻倍至 65536 tokens）合法可超 10 分钟；
      # 死流由 LLM 客户端 180s 空闲看门狗兜底；超时经 SSE 专用异常处理优雅报错（不再 406）
      request-timeout: 1800000

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:gewu_prod}?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048&useServerPrepStmts=true&rewriteBatchedStatements=true
    username: ${DB_USERNAME:gewu}
    password: ${DB_PASSWORD:gewu123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 10
      maximum-pool-size: 50
      idle-timeout: 60000
      max-lifetime: 1800000
      connection-timeout: 10000
      leak-detection-threshold: 30000
      connection-test-query: SELECT 1
      validation-timeout: 5000

  flyway:
    # 主库迁移由 FlywayMigrationConfig 显式 Bean 接管（多数据源下自动配置退避）
    baseline-version: 37
    validate-on-migrate: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          min-idle: 8
          max-active: 32
          max-idle: 16
          max-wait: 3000ms
        shutdown-timeout: 200ms

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.gewu.domain
  global-config:
    db-config:
      id-type: ASSIGN_UUID
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

gewu:
  project:
    name: 格物平台
    version: 1.0.0-SNAPSHOT

  security:
    jwt:
      secret: ${JWT_SECRET:change-me-in-production}
      access-expiration: 1800000
      refresh-expiration: 604800000
    password:
      min-length: 8
      require-uppercase: true
      require-lowercase: true
      require-digit: true
      require-special: true
    audit:
      enabled: true
      retention-days: 1095
    xss:
      enabled: true
    headers:
      enabled: true

  database:
    type: mysql

  cache:
    type: dragonfly
    ttl: 300000

  performance:
    slow-sql-threshold-ms: 500
    cache:
      user-ttl: 1800000
      project-ttl: 1800000
      session-ttl: 600000
      agent-ttl: 3600000
      workflow-ttl: 3600000
      permission-ttl: 7200000
    rate-limit:
      default-limit: 100
      default-window: 60

  sandbox:
    type: docker
    runtime: runc
    image: gewu/sandbox:latest
    api:
      url: http://gewu-sandbox:8082/api/v1/sandboxes
      internal-key: ${GEWU_INTERNAL_API_KEY:gewu-dev-internal-key-change-me}

  ai:
    gateway:
      url: ${AI_GATEWAY_URL:http://localhost:8081}
    models:
      - name: qwen
        provider: alibaba
        api-key: ${AI_API_KEY:}
      - name: deepseek
        provider: deepseek
        api-key: ${AI_API_KEY:}

  # Wenshi 网络搜索推理增强（生产环境）
  wenshi:
    web-search:
      base-url: ${SEARXNG_BASE_URL:http://searxng:8080}
      max-results: 5
      timeout-ms: 8000
      min-confidence: 0.6
      llm-arbitrate-threshold: 0.4
      llm-arbitrate-provider: ${LLM_ARBITRATE_PROVIDER:deepseek}
      llm-arbitrate-model: ${LLM_ARBITRATE_MODEL:deepseek-chat}
      auto-enhance: true
      auto-enhance-min-kb: 3
      snippet-max-length: 200

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: gewu-platform
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.75, 0.95, 0.99
      slo:
        http.server.requests: 100ms, 200ms, 500ms
      minimum-expected-value:
        http.server.requests: 5ms
      maximum-expected-value:
        http.server.requests: 30s
  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: always
      roles: health
  health:
    db:
      enabled: true
    diskspace:
      enabled: true

logging:
  level:
    root: INFO
    com.gewu: INFO
    org.springframework.security: WARN
    org.springframework.web: WARN
    org.hibernate.validator: WARN
  pattern:
    dateformat: yyyy-MM-dd HH:mm:ss.SSS
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 30
      total-size-cap: 3GB
      clean-history-on-start: false
