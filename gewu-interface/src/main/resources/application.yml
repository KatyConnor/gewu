# 格物平台 - 开发环境配置

server:
  port: 8081
  tomcat:
    # S8 取证：请求耗时(%D)/首字节(%F)/状态/字节数，挂起类问题回溯依赖
    accesslog:
      enabled: true
      directory: /home/wnn/devcode/ai-code/gewu-platform/logs
      prefix: access
      suffix: .log
      pattern: "%h %t \"%r\" %s %b %D %F"

spring:
  profiles:
    active: dev

  # 异步请求超时配置 - SSE 流式对话需要足够长的超时
  # 推理模型（LongCat-2.0、DeepSeek-R1）的推理过程可能持续数分钟
  # 默认 Tomcat 30s 超时会导致流式响应被截断后一次性 flush
  mvc:
    async:
      # 2 小时安全帽（替代任务总时长语义）：分层空闲超时才是正确姿势——
      # 模型层 180s 空闲看门狗管「模型是否有响应」、工具层单工具超时、
      # 业务层预算/轮次。马拉松 agent 任务（深度思考+截断重试+多轮工具）
      # 小时级是合法形态，30 分钟墙钟会误杀；2h 帽仅防病态僵尸连接
      request-timeout: 7200000

  # 数据库配置
  datasource:
    url: jdbc:mysql://localhost:3306/gewu_dev?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: gewu
    password: gewu123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000

  # Flyway 数据库迁移
  # baseline-version=37（S8 拆弹）：既有库由旧 V1 脚本初始化且从未跑过 Flyway，
  # baseline=37 使其对齐当前 schema 后从 V38 增量接管；
  # 若保持 0，下次重启会从 V1 全量重放撞种子数据导致启动失败
  # 注意：工程含 MySQL/wenshi PG 双数据源，Flyway 自动配置在多数据源下会静默
  # 退避——必须显式指定 url/username/password 才能让主库迁移生效（S8 实测发现）
  flyway:
    # 主库迁移由 FlywayMigrationConfig 显式 Bean 接管（多数据源下自动配置退避），
    # baseline-version 由该 Bean 读取
    baseline-version: 37



  # Redis/DragonflyDB 配置
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 5000ms

  # Jackson 配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.gewu.domain
  global-config:
    db-config:
      id-type: ASSIGN_UUID
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# Agent 引擎配置
agent:
  engine:
    # 启用 Agent 引擎 SPI 适配器（桥接 Wenshi 认知/记忆能力到 Agent 引擎）
    adapter:
      enabled: true
    # 同步 LLM 请求超时（默认 120s；流式不设 per-request 超时）
    llm:
      request-timeout: 120s
      connect-timeout: 30s
    # 会话历史默认加载条数（默认 50）
    engine:
      default-history-limit: 50
    # 预算控制（L2 默认等级；L1/L3 按下列倍率缩放）
    budget:
      time-budget-ms: 300000
      l1-token-divisor: 5
      l1-time-budget-ms: 30000
      l1-max-rounds: 3
      l3-token-multiplier: 3
      l3-time-multiplier: 4
      l3-rounds-multiplier: 2
    # Agent 生命周期（心跳超时 / 全局执行超时）
    lifecycle:
      heartbeat-timeout-ms: 60000
      global-timeout-ms: 300000

# 格物平台配置
gewu:
  project:
    name: 格物平台
    version: 1.0.0-SNAPSHOT

  # 语义缓存分场景配置（T5.4）：QA/知识问答场景建议开启（阈值 0.95），
  # 代码生成等确定性低场景按 agentId 加入 disabled-agents 或全局关闭
  semantic-cache:
    enabled: ${GEWU_SEMANTIC_CACHE_ENABLED:true}
    threshold: ${GEWU_SEMANTIC_CACHE_THRESHOLD:0.95}
    disabled-agents: ${GEWU_SEMANTIC_CACHE_DISABLED_AGENTS:}

  # SSE 多副本分布式广播（T5.1）：K8s 多副本部署时置 true（Redis Pub/Sub），
  # 单副本保持 false（零依赖，本地直发）
  sse:
    distributed: ${GEWU_SSE_DISTRIBUTED:false}

  # 质量评测 LLM-as-Judge（S7）：指向已配置有效 Key 的供应商
  evaluation:
    judge-provider: ${GEWU_EVALUATION_JUDGE_PROVIDER:ark-code}
    judge-model: ${GEWU_EVALUATION_JUDGE_MODEL:glm-5.3-flash}

  # 机器编号（-1 表示自动通过 hostname 计算，容器部署时通过环境变量 MACHINE_ID 注入）
  machine-id: ${MACHINE_ID:-1}

  # Wenshi 知识增强配置
  wenshi:
    enabled: true
    embedding:
      adapter: bge-small
      model-path: models/bge-small-zh-v1.5.onnx
      dimension: 384
      tokenizer-path: models/tokenizer.json
    vectorstore:
      adapter: pgvector
    datasource:
      url: jdbc:postgresql://localhost:5432/wenshi
      username: wenshi
      password: ${WENSHI_DB_PASSWORD:wenshi123456}
      driver-class-name: org.postgresql.Driver
    # 网络搜索推理增强配置
    routing:
      # 终审裁剪（2026-09-12，docs/design/44 门 1）：本地基准评测显示 wenshi
      # 引擎质量无增益（-0.4%）且时长 2.4x，生产流式路由回 legacy 引擎；
      # Wenshi SPI 保留维护态，知识库填充后可按 43 号规则复评
      stream: legacy
    web-search:
      base-url: ${SEARXNG_BASE_URL:http://searxng:8080}
      max-results: 5
      timeout-ms: 8000
      min-confidence: 0.6
      llm-arbitrate-threshold: 0.4
      llm-arbitrate-provider: ${LLM_ARBITRATE_PROVIDER:deepseek}
      llm-arbitrate-model: ${LLM_ARBITRATE_MODEL:deepseek-chat}
      auto-enhance: true
      auto-enhance-min-kb: 3
      snippet-max-length: 200

  # 敏感数据加密（32 位十六进制 SM4 密钥，生产环境必须替换）
  crypto:
    api-key-secret: ${GEWU_CRYPTO_API_KEY_SECRET:0123456789abcdef0123456789abcdef}

  # 安全配置
  security:
    jwt:
      secret: ${JWT_SECRET:gewu-platform-jwt-secret-key-must-be-at-least-256-bits-long-for-hs256}
      access-expiration: 72000000  # 30分钟
      refresh-expiration: 604800000  # 7天
    password:
      min-length: 8
      require-uppercase: true
      require-lowercase: true
      require-digit: true
      require-special: true
    audit:
      enabled: true
      retention-days: 1095
    xss:
      enabled: true
    headers:
      enabled: true
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:}

  database:
    type: oceanbase

  cache:
    type: dragonfly
    ttl: 300000  # 5分钟

  # 性能优化配置
  performance:
    slow-sql-threshold-ms: 1000
    cache:
      user-ttl: 1800000
      project-ttl: 1800000
      session-ttl: 600000
      agent-ttl: 3600000
      workflow-ttl: 3600000
      permission-ttl: 7200000
    rate-limit:
      default-limit: 100
      default-window: 60

  sandbox:
    type: docker
    runtime: runc
    image: gewu/sandbox:latest
    api:
      url: http://localhost:8082/api/v1/sandboxes
      internal-key: ${GEWU_INTERNAL_API_KEY:gewu-dev-internal-key-change-me}
    # 开发工作空间沙箱（S9 F3 文件工具路由目标）；
    # 默认 alpine（Docker cp 读写 + ls 即可支撑文件工具），可按部署环境覆盖
    dev:
      image: ${GEWU_DEV_IMAGE:alpine:latest}

  ai:
    gateway:
      url: http://localhost:8081
    models:
      - name: qwen
        provider: alibaba
        api-key: ${QWEN_API_KEY:}
      - name: deepseek
        provider: deepseek
        api-key: ${DEEPSEEK_API_KEY:}

# Actuator + Prometheus
management:
  server:
    port: 9081
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: gewu-platform
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: always

  # OpenTelemetry 分布式追踪导出（L2 应用层可观测性）
  # actuator 使用 OTLP HTTP 协议（okhttp），端口应为 4318（4317 是 gRPC 端口）
  # 默认关闭导出：本地未启动 Jaeger 时避免持续报 ConnectException
  # 启用方式：OTEL_TRACING_ENABLED=true + 启动 deploy/monitoring 的 Jaeger（或 K8s 环境自带）
  tracing:
    sampling:
      probability: ${OTEL_TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      # Spring Boot 的 OTLP 导出器要求完整 URL（含 /v1/traces 路径），缺路径会 404
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
      export:
        enabled: ${OTEL_TRACING_ENABLED:false}

# OpenTelemetry SDK 说明：OTel SDK 自动装配读取 OTEL_* 环境变量/系统属性，不读取此 yaml；
# 此处仅为环境变量取值参考（默认值已在上方 management.otlp 中生效）
otel:
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}
      protocol: http/protobuf

# SpringDoc 配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    doc-expansion: none
    display-request-duration: true
    groups-order: desc

# MinIO 对象存储
minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket: gewu-documents

# 日志配置
logging:
  level:
    root: INFO
    com.gewu: DEBUG
    org.springframework.security: DEBUG
  pattern:
    dateformat: yyyy-MM-dd HH:mm:ss.SSS