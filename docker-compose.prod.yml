# 格物平台 - 生产环境配置
# 版本：V1.1（公共配置模式）
#
# 使用方法：
#   docker-compose -f docker-compose.prod.yml up -d
#   docker-compose -f docker-compose.prod.yml down
#
# 注意：生产环境需要确保 .env 文件已正确配置

services:
  mysql:
    image: mysql:8.0
    container_name: gewu-mysql-prod
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: gewu_prod
      MYSQL_USER: gewu
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-gewu123456}
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max-connections=200
      --innodb-buffer-pool-size=1G
      --slow-query-log=ON
      --long-query-time=1
    ports:
      - "3306:3306"
    volumes:
      - gewu-mysql-data:/var/lib/mysql
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root123456}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - gewu-network

  pgvector:
    image: pgvector/pgvector:pg16
    container_name: gewu-pgvector-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: wenshi
      POSTGRES_USER: wenshi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wenshi123456}
    volumes:
      - gewu-pgvector-data:/var/lib/postgresql/data
      - ./docker/pgvector/init.sql:/docker-entrypoint-initdb.d/init.sql
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wenshi -d wenshi"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - gewu-network

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    container_name: gewu-dragonfly-prod
    restart: unless-stopped
    command: ["dragonfly", "--logtostderr", "--maxmemory=1G"]
    ports:
      - "6379:6379"
    volumes:
      - gewu-dragonfly-data:/data
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gewu-network

  rocketmq-nameserver:
    image: apache/rocketmq:5.3.1
    container_name: gewu-rocketmq-nameserver-prod
    restart: unless-stopped
    command: ["sh", "mqnamesrv"]
    ports:
      - "9876:9876"
    environment:
      JAVA_OPT_EXT: "-server -Xms512m -Xmx512m -Xmn256m"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "netstat -an | grep 9876 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      - gewu-network

  rocketmq-broker:
    image: apache/rocketmq:5.3.1
    container_name: gewu-rocketmq-broker-prod
    restart: unless-stopped
    command: ["sh", "mqbroker", "-n", "rocketmq-nameserver:9876", "--enable-controller-mode", "true"]
    ports:
      - "10909:10909"
      - "10911:10911"
    environment:
      JAVA_OPT_EXT: "-server -Xms1g -Xmx1g -Xmn512m"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    depends_on:
      rocketmq-nameserver:
        condition: service_healthy
    networks:
      - gewu-network

  gewu-platform:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gewu-platform-prod
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/gewu_prod?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: gewu
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-gewu123456}
      SPRING_DATA_REDIS_HOST: dragonfly
      SPRING_DATA_REDIS_PORT: "6379"
      ROCKETMQ_NAME_SERVER: rocketmq-nameserver:9876
      # Wenshi 知识增强数据库配置
      WENSHI_DB_URL: jdbc:postgresql://pgvector:5432/wenshi
      WENSHI_DB_USERNAME: wenshi
      WENSHI_DB_PASSWORD: ${POSTGRES_PASSWORD:-wenshi123456}
      # 单容器部署：SSE 分布式广播关闭；扩多副本时置 true（T5.1）
      GEWU_SSE_DISTRIBUTED: "false"
      GEWU_CRYPTO_API_KEY_SECRET: ${GEWU_CRYPTO_API_KEY_SECRET:13b4a0eab2f1f1093f87d0552fddca1f}
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    depends_on:
      mysql:
        condition: service_healthy
      pgvector:
        condition: service_healthy
      dragonfly:
        condition: service_healthy
      rocketmq-broker:
        condition: service_started
    networks:
      - gewu-network

volumes:
  gewu-mysql-data:
  gewu-pgvector-data:
  gewu-dragonfly-data:

networks:
  gewu-network:
    driver: bridge
