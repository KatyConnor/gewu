server:
  port: 8083

spring:
  profiles:
    active: dev

  datasource:
    url: jdbc:mysql://localhost:3306/gewu_dev?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: gewu
    password: gewu123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 3
      maximum-pool-size: 10
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000

  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 5000ms

  # schema 由主应用（gewu-interface）的 Flyway 独占管理，本服务共库不执行迁移
  flyway:
    enabled: false

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.gewu.domain
  global-config:
    db-config:
      id-type: ASSIGN_UUID
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true

gewu:
  admin:
    # 认证透传目标：登录/注册/刷新/登出由主应用完成（账号体系唯一来源）
    main-api-base: ${GEWU_MAIN_API_BASE:http://localhost:8081}
  crypto:
    api-key-secret: ${GEWU_CRYPTO_API_KEY_SECRET:13b4a0eab2f1f1093f87d0552fddca1f}
  security:
    jwt:
      # 与主应用同源：同一密钥签发/校验（登录在主应用 /v1/auth/login 完成）
      # 必须与主应用逐字一致：主应用签发的 token 由本服务校验
      secret: ${JWT_SECRET:gewu-platform-jwt-secret-key-must-be-at-least-256-bits-long-for-hs256}
      access-expiration: ${JWT_ACCESS_EXPIRATION:86400000}
      refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO
    com.gewu: DEBUG
  pattern:
    dateformat: yyyy-MM-dd HH:mm:ss.SSS
