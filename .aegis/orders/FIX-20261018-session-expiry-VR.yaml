lessons:
  - "避错：单页应用以 Redux 切页时，认证态必须在渲染层分流（独立登录壳），否则任何 401 兜底都只能得到'嵌壳登录'形态；登录页与后台壳的分离应作为脚手架默认结构"
  - "防错：isAuthenticated（存在性）与 isTokenValid（有效期）语义不同，空闲场景必须用后者做主动检测；建议后续抽公共 useAuthExpiry hook 供 gewu-web 复用（反哺 META 判型）"
