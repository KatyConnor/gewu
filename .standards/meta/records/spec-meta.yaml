# 判型决策记录（STD-META-001 §六）— META
# 由 META 判型门产出；源模板 .standards/meta/templates/form-classification-record.yaml
content_id: "META 规范-技能划分与层级决策"
content_kind: workflow+checker
source: retro-classification（V1.6 自指判型迁移至记录制）
version: "V1.0"

form_tests:
  q1_harm: true          # 违反是否造成可判定危害
  q1_evidence: "误把红线做成技能=违规不可拦截；误把变量装全局=项目互相污染"
  q2_shall_verifiable: true   # "应/不应"可表述并机器校验
  q2_verifier: ".standards/meta/scripts/meta_check.py（G1-G5+G6记录完备性）"
  q3_multisol: partial      # 是否多解、依赖情境与品味
  distribution: "artifact-gate（治理产物接入前）+ intent-word（判型咨询词族）"
form: spec

level_tests:
  invariant: true       # 组织级不变量
  repo_bound: partial     # 仓库绑定变量
  failure_radius: "org-wide（判型判据）+record归属"
level: dual

type_model: 质量门型·治理域（元层）
mutex_group: false
trigger_face: "新建/修改规范或技能之后、接入/分发之前；判型咨询"
gates: [".standards/meta/scripts/meta_check.py"]

lifecycle:
  promotion_watch: ["判型判据自身修订→§五接入流程重走（自指）"]
  exception_budget: "判型复议≤2次/季度，超出启动判据校准"
  demotion_signal: "判型结论与运行冲突频发→判据校准"

decided_by: "Nova（存量追溯判型 · META V1.6 建门后补档）"
decided_at: "2026-09-29T18:30:00+08:00"
evidence_refs: ["TRIGGER-MATRIX §一/§十四", "META-RULES §一/§二"]
