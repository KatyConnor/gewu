content_id: "SDLC 角色技能体系（V1.3）"
source: promotion-candidate
version: "V1.3"
form_tests:
  q1_harm: true
  q1_evidence: "运营域无角色主导=上线后增长无人负责（产品'生'完没人'养'）/实验无纪律（无对照/未过显著性放量）/触达无频控（用户骚扰）/指标口径漂移无治理（数据不可比）"
  q2_shall_verifiable: true
  q2_verifier: "suite_check G8 组 ext_roles 数组加一行（参数化设计兑现：三角色循环 9 断言+计数 1+判型记录 3+调度器 1=14 断言）——回归实跑全绿；SDLC.md 计数断言升级为 6 阶段/14 角色/32 技能"
  q3_multisol: partial
  distribution: "artifact-gate（诊断报告/分层触达矩阵+频控预算/实验设计单四要素+决策单双证据/活动 SOP 五段式）+ workflow-rules（RISK-01~08 + 红线七条）"
  q4_domain_occupied: false
  q4_evidence: "运营域角色层空位：08 的 data-metrics-design 管指标体系设计与埋点、ab-test-analysis 管统计分析（数据侧）；09 管稳定性；02 管上线前需求——上线后增长策略无主。设计时核对 08 技能卡避免抢指标设计层（本版技能一由 metrics 改定 funnel-diagnosis，即狗粮边界校准实证）"
form: spec          # 不变
level_tests:
  invariant: true
  repo_bound: false
  failure_radius: "org-wide（发布后全周期运营纪律强度提升）"
level: dual          # 不变
type_model: 任务型·互斥（开发域）  # 不变——调度器注册表语义层零改动
mutex_group: true
action: 采纳并接入（V1.2 → V1.3 域内内容级修订 + 阶段模型扩展，六落点）
acceptance:
  standards_basis: "AARRR 海盗指标（McClure）/北极星指标框架（Amplitude）/RFM 分层/Hacking Growth（Ellis & Brown）/A/B 实验统计纪律（MDE 与功效分析，与 08 UTSS 联动）"
  gates: "实验三铁律+频控红线+口径登记制+虚荣指标防线（R04）+决策双证据"
  dogfood: 待实跑（候选：product-portal 公开门户运营诊断首战）
