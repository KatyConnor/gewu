# 判型决策记录（STD-META-001 §六）— LR
# 由 META 判型门产出；源模板 .standards/meta/templates/form-classification-record.yaml
content_id: "LR 遗留项目重构工程"
content_kind: workflow
source: retro-classification
version: "V1.0"

form_tests:
  q1_harm: true          # 违反是否造成可判定危害
  q1_evidence: "无 Doc-Gate 推进=重构失控；22模板缺产出=决策无据"
  q2_shall_verifiable: true   # "应/不应"可表述并机器校验
  q2_verifier: ".standards/lr/scripts/lr_check.py + Doc-Gate 硬门禁"
  q3_multisol: partial      # 是否多解、依赖情境与品味
  distribution: "intent-word（重构/改造）"
form: spec

level_tests:
  invariant: true       # 组织级不变量
  repo_bound: true     # 仓库绑定变量
  failure_radius: "org-wide（七阶段门禁）+project（.lr/进度与模板实例）"
level: dual

type_model: 任务型·互斥（重构域）
mutex_group: true（第二方）
trigger_face: "重构/技术改造/性能优化工程"
gates: [".standards/lr/scripts/lr_check.py"]

lifecycle:
  promotion_watch: ["重构模式库→SDLC技能池候选"]
  exception_budget: "R阶段跳过申请须补产出后置评审"
  demotion_signal: "模板实例化率低→模板集瘦身"

decided_by: "Nova（存量追溯判型 · META V1.6 建门后补档）"
decided_at: "2026-09-29T18:30:00+08:00"
evidence_refs: ["TRIGGER-MATRIX §一/§十四", "META-RULES §一/§二"]
