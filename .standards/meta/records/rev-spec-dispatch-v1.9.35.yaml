# 判型决策记录（STD-META-001 §六）— V1.9.35 调度指令重构批（每任务强制+语义先行+脏数据隔离）
# 触发：2026-10-22 23:57~2026-10-23 00:28 用户连环实测报障（深夜单）：装 V1.9.34 后每次指令延迟 1 分 12 秒；
#       trace-log 两次 report 一模一样（零真实流量）；zcode 思考内容零规范痕迹；黄金测试 MARKER 复述成功（通道通）
# 判定链（当日闭环五步）：延迟与 STD-HUB 无关（调度器零执行=零开销·勘误上轮"多轮往返税"抢跑）→
#       通道通+执行断（读了不执行·指令遵循层）→ 两嫌疑：会话首条限定（长会话裸奔）+脚本首步连锁放弃（L1 不可执行跳过全流程）
