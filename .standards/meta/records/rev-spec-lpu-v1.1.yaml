# 性质：修改规范（既有 spec 的门禁脚本缺陷修复），形态/层级/接入类型均不变

content_id: "LPU 遗留项目逆向理解（V1.1 修订）"
content_kind: checker
source: promotion-candidate   # dogfood 实证缺陷 → 修订候选
version: "V1.1"

form_tests:
  q1_harm: true
  q1_evidence: "EVIDENCE_RE 白名单缺 rs/toml/json → Rust 项目证据锚点不被计数（半盲校验）；G5 正则匹配 [A]/[B]/[C] 三级但报错文案称 [C] → 误报 [A]/[B] 为违规或掩盖真实语义"
  q2_shall_verifiable: true
  q2_verifier: "修复后 lpu_check.py G3/G5 行为回归测试（旧缺陷复现→新行为验证）+ webpkg/.lpu 门禁复跑 PASS"
  q3_multisol: false          # 两处修复均有唯一正确语义：白名单补全 / 正则与文案对齐（选择按 [C] 语义收窄正则）
  distribution: "artifact-gate（lpu_check.py exit code 即门禁）"
form: spec                     # 不变：修订不改变形态

level_tests:
  invariant: true
  repo_bound: false            # 本次修订对象是校验器逻辑本身（全局不变量层），不新增仓库绑定
  failure_radius: "org-wide（所有 Rust/新兴语言项目跑 LPU 均受白名单缺陷影响）"
level: dual                    # 不变

type_model: 任务型·互斥（理解域）   # 不变
mutex_group: true（第一方）
trigger_face: "理解/摸底/接手/考古遗留项目（不变）"
gates: [".standards/lpu/scripts/lpu_check.py（V1.1）", "Doc-Gate"]

lifecycle:
  promotion_watch: ["EVIDENCE_RE 白名单扩展后是否出现锚点注水（锚点计数虚高而证据空洞）——若出现需加语义级校验"]
  exception_budget: "无新增例外条款"
  demotion_signal: "无"

