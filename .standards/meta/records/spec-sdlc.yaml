# 判型决策记录（STD-META-001 §六）— SDLC
# 由 META 判型门产出；源模板 .standards/meta/templates/form-classification-record.yaml
content_id: "SDLC 软件生命周期角色技能"
content_kind: workflow+skillpool
source: retro-classification
version: "V1.0"

form_tests:
  q1_harm: true          # 违反是否造成可判定危害
  q1_evidence: "角色越权决策=架构失控；技能引用断链=能力空转"
  q2_shall_verifiable: true   # "应/不应"可表述并机器校验
  q2_verifier: "G5 角色→技能引用闭环（suite_check）"
  q3_multisol: partial      # 是否多解、依赖情境与品味
  distribution: "intent-word（开发任务/需求实现）"
form: hybrid（规范面：角色路由结构；技能面：.standards/skills/ 23技能池——体系内混合形态实证）

level_tests:
  invariant: true       # 组织级不变量
  repo_bound: true     # 仓库绑定变量
  failure_radius: "org-wide（角色体系）+project（角色激活/技能池扩展）"
level: dual

type_model: 任务型·互斥（开发域）
mutex_group: true（第四方）
trigger_face: "开发任务/需求实现/功能设计"
gates: ["G5 引用闭环检查"]

lifecycle:
  promotion_watch: ["第24+技能入池须过META判型（矩阵§十四）"]
  exception_budget: "角色裁剪须声明理由"
  demotion_signal: "技能复用频次持续低→池瘦身"

decided_by: "Nova（存量追溯判型 · META V1.6 建门后补档）"
decided_at: "2026-09-29T18:30:00+08:00"
evidence_refs: ["TRIGGER-MATRIX §一/§十四", "META-RULES §一/§二"]
