# 判型决策记录（STD-META-001 §六）— AETC
# 由 META 判型门产出；源模板 .standards/meta/templates/form-classification-record.yaml
content_id: "AETC 执行留痕管控"
content_kind: constraint
source: retro-classification
version: "V1.0"

form_tests:
  q1_harm: true          # 违反是否造成可判定危害
  q1_evidence: "R2/R3 危险操作无痕=不可审计不可回退"
  q2_shall_verifiable: true   # "应/不应"可表述并机器校验
  q2_verifier: ".standards/audit/tools/audit_log.py + 留痕覆盖率检查"
  q3_multisol: false      # 是否多解、依赖情境与品味
  distribution: "load（装即生效）"
form: spec

level_tests:
  invariant: true       # 组织级不变量
  repo_bound: true     # 仓库绑定变量
  failure_radius: "org-wide+project"
level: dual

type_model: 横切型·常驻
mutex_group: false
trigger_face: "一切阶段切换/R2/R3/批量修改"
gates: [".standards/audit/tools/audit_log.py"]

lifecycle:
  promotion_watch: ["audit/config.json 风险清单新条目晋升观察"]
  exception_budget: "R级判定争议≤2次/季，超出校准风险清单"
  demotion_signal: "风险清单条目长期未命中→移除并记录"

decided_by: "Nova（存量追溯判型 · META V1.6 建门后补档）"
decided_at: "2026-09-29T18:30:00+08:00"
evidence_refs: ["TRIGGER-MATRIX §一/§十四", "META-RULES §一/§二"]
