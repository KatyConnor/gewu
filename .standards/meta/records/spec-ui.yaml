# 判型决策记录（STD-META-001 §六）— UI
# 由 META 判型门产出；源模板 .standards/meta/templates/form-classification-record.yaml
content_id: "UI 前端设计规范"
content_kind: constraint
source: retro-classification
version: "V1.0"

form_tests:
  q1_harm: true          # 违反是否造成可判定危害
  q1_evidence: "硬禁令违反=可用性/一致性事故（对比度/响应式/状态缺失）"
  q2_shall_verifiable: true   # "应/不应"可表述并机器校验
  q2_verifier: "U-CHK 25项自检门禁 + design-tokens.json 校验"
  q3_multisol: partial      # 是否多解、依赖情境与品味
  distribution: "intent-word（界面词族）+ 叠加约束（可与任意任务型并存）"
form: spec

level_tests:
  invariant: true       # 组织级不变量
  repo_bound: true     # 仓库绑定变量
  failure_radius: "org-wide（五法则/硬禁令）+project（design-tokens 产品令牌）"
level: dual

type_model: 任务型·响应式·叠加约束（界面生成）
mutex_group: false
trigger_face: "生成界面/前端页面/UI组件/样式调整"
gates: ["U-CHK 25项"]

lifecycle:
  promotion_watch: ["76反模式扩充→版本评审"]
  exception_budget: "产品令牌偏离须走令牌变更评审"
  demotion_signal: "反模式误报率超标→模式校准"

decided_by: "Nova（存量追溯判型 · META V1.6 建门后补档）"
decided_at: "2026-09-29T18:30:00+08:00"
evidence_refs: ["TRIGGER-MATRIX §一/§十四", "META-RULES §一/§二"]
