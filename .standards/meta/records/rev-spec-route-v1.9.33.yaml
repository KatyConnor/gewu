content_id: "调度意图路由与 SDLC 角色直连（V1.9.33 语义直连批）"
source: user-bug-report   # 用户实测报障（最高质量进化输入）
version: "V1.9.33"

form_tests:
  q1_harm: true
  q1_evidence: "用户环境三天零角色触发；本地复现 7 条日常口语句语义全 0 分；语义引擎 objs/arts/feats 三列 split 参数错误致十三版空转（selftest 只测 type 通道从未暴露）；落痕 cwd 相对拼接致双 .standards 错位"
  q2_shall_verifiable: true
  q2_verifier: "suite_check G19 五断言（静态 2+行为 3）：调度器语义直连指令在场/15 卡三十秒版头齐/--text 7 例句全唯一命中/落痕无双错位/selftest 全过——行为级门禁首例（静态断言→行为断言的门禁性质扩展）"
  q3_multisol: partial
  distribution: "spec-revision（三正本修订+门禁扩展）"
