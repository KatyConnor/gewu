extra_note: |
  【三批结构闭环】V1.9.33 修链路（能到）→34 修观测（能看）→35 修触发（该跑）→36 修执行闭环（判定即读）——
  黄金测试（用户质询「引用原文」）是「自报≠执行」的分野证据，成本一轮对话；trace dump 是「测量口径先验」的
  分野证据（3 秒聚集=批量测试特征）。方法论沉淀两条：①**指标的采集机理先于指标结论**（谁写的、什么条件写、
  测不到什么）②**通道判定与执行判定分离取证**（V1.9.35 判型已沉淀——本批是其验证：通道通、执行断，证据=黄金测试）。
  【棘轮注记】断言 243→250 只增；release.sh 门禁新增 3 行只增；红线（不降级任何安全风险和门禁）贯穿。
  下一轮实测建议：装 V1.9.36 后观察 Agent 三段式判定句出现率+--read-entry 同链事件——D4 黄金测试可复用（质询不变）。

