# 判型决策记录（STD-META-001 §六）— OPS
# 由 META 判型门产出；源模板 .standards/meta/templates/form-classification-record.yaml
content_id: "OPS 生产运维智能体"
content_kind: workflow+constraint
source: retro-classification
version: "V1.0"

form_tests:
  q1_harm: true          # 违反是否造成可判定危害
  q1_evidence: "生产误操作=服务事故；铁律违反=变更不可回退"
  q2_shall_verifiable: true   # "应/不应"可表述并机器校验
  q2_verifier: ".standards/ops/scripts/ops_check.py + 事件主线契约"
  q3_multisol: partial      # 是否多解、依赖情境与品味
  distribution: "intent-word（告警/故障/值班/巡检）"
form: spec

level_tests:
  invariant: true       # 组织级不变量
  repo_bound: true     # 仓库绑定变量
  failure_radius: "org-wide（五铁律）+project（.ops/台账/值班语境）"
level: dual

type_model: 任务型·互斥（运维域）
mutex_group: true（第三方）
trigger_face: "告警处理/故障响应/变更执行/巡检"
gates: [".standards/ops/scripts/ops_check.py"]

lifecycle:
  promotion_watch: ["慢性数据包诊断模式→LPU反哺候选"]
  exception_budget: "高危变更例外须双人复核+事后补审"
  demotion_signal: "E1-E7事件分布漂移→主线模板校准"

decided_by: "Nova（存量追溯判型 · META V1.6 建门后补档）"
decided_at: "2026-09-29T18:30:00+08:00"
evidence_refs: ["TRIGGER-MATRIX §一/§十四", "META-RULES §一/§二"]
