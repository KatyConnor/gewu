# 判型决策记录（STD-META-001 §六）— LPU
# 由 META 判型门产出；源模板 .standards/meta/templates/form-classification-record.yaml
content_id: "LPU 遗留项目逆向理解"
content_kind: workflow
source: retro-classification
version: "V1.0"

form_tests:
  q1_harm: true          # 违反是否造成可判定危害
  q1_evidence: "无证据断言=错误认知进设计；证据红线违反=逆向结论失真"
  q2_shall_verifiable: true   # "应/不应"可表述并机器校验
  q2_verifier: "Doc-Gate 8份产出契约 + .standards/lpu/scripts/lpu_check.py"
  q3_multisol: partial      # 是否多解、依赖情境与品味
  distribution: "intent-word（理解/摸底/接手项目）"
form: spec

level_tests:
  invariant: true       # 组织级不变量
  repo_bound: true     # 仓库绑定变量
  failure_radius: "org-wide（五维模型/红线）+project（.lpu/与docs/lpu/产出）"
level: dual

type_model: 任务型·互斥（理解域）
mutex_group: true（第一方）
trigger_face: "理解/摸底/接手/考古遗留项目"
gates: [".standards/lpu/scripts/lpu_check.py", "Doc-Gate"]

lifecycle:
  promotion_watch: ["项目文档五维评分模式→技能沉淀候选"]
  exception_budget: "阶段跳步申请须给证据理由"
  demotion_signal: "文档模板字段长期空置→模板校准"

decided_by: "Nova（存量追溯判型 · META V1.6 建门后补档）"
decided_at: "2026-09-29T18:30:00+08:00"
evidence_refs: ["TRIGGER-MATRIX §一/§十四", "META-RULES §一/§二"]
