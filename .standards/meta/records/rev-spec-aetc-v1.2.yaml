type_mode: crosscut-always

revision:
  - id: REV-AETC-05
    defect: "规范体系自身触发/执行链路零监控——报障排查靠手动取证，不可持续"
    evidence_ref: "2026-10-22 全天诊断链（用户环境 intent-log 装痕误认流痕/.standards mtime 取证/三层断裂推断）"
    fix: "trace-log.jsonl 五类事件（route·entry_read·role_card_read·gate·install_selftest）+trace_log.py（append API+CLI+--report 漏斗）+trigger_check 三入口 route 自动接线+install.sh 装痕打标+AETC §11 自报协议"
  - id: REV-AETC-06
    defect: "可靠性分层未声明——读取层自报与机器强制混同会误导排查"
    evidence_ref: "V1.9.33 实证：Agent 对脚本调用为零——纯机器方案在该层会空转"
    fix: "分层设计显式化：route/install/gate=机器强制（脚本跑即有）；entry_read/role_card_read=审计级（缺报本身是断裂信号——漏斗判读表三形态：route 有 entry 零=平台断/入口有卡零=角色断/三层全=链路通）"

extra_note: |
  【工程教训断言化】①Write 工具与 Bash 属主不一致（root vs z）——dispatch 目录文件统一走 Bash python 写或写后替换法拿属主；②门禁断言目标面要对齐（install.sh 是装包工具不在安装面——G10 跳过先例复用）；③事件名是位置参数不是 --key（协议命令先跑通再写文档）。
  【与 V1.9.33 的接续】本批是「角色触发批」的观测面闭环：V1.9.33 修通了链路（语义直连+单跳版头），本批让链路可观测（route 流量→读入口→读卡三层漏斗）——下一周期用户实测数据经 --report 回流，即为断层的量化证据。

