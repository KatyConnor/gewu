# 判型决策记录（STD-META-001 §六）— UCSS
# 由 META 判型门产出；源模板 .standards/meta/templates/form-classification-record.yaml
content_id: "UCSS 行业代码扫描规范 v1.1"
content_kind: constraint+checker
source: external-delivery
version: "v1.1"

form_tests:
  q1_harm: true          # 违反是否造成可判定危害
  q1_evidence: "C/H 级漏报放行=安全漏洞上线；门禁失效=带洞交付"
  q2_shall_verifiable: true   # "应/不应"可表述并机器校验
  q2_verifier: ".standards/ucss/scripts/ucss_gate.py（SARIF 门禁 exit 2 机制层强制）+ 五级/三档门禁 requirement 形态"
  q3_multisol: partial      # 是否多解、依赖情境与品味
  distribution: "artifact-gate + intent-word（扫描词族）+ retrieval（skill 检索）"
form: hybrid（规范面：规则体系+CI门禁=第十二套；技能面：.standards/ucss/ 本体即 Agent Skills 技能可直装）

level_tests:
  invariant: true       # 组织级不变量
  repo_bound: true     # 仓库绑定变量
  failure_radius: "org-wide（安全基线）+ project（语言矩阵/工具链启用）"
level: dual

type_model: 质量门型·扫描域
mutex_group: false
trigger_face: "代码产出/修改后、提交/交付前（产物门）；扫描/SAST/密钥泄漏/审计词族；CI SARIF 门禁"
gates: [".standards/ucss/scripts/ucss_gate.py"]

lifecycle:
  promotion_watch: ["D4/D5 独有发现真阳性率连续4周≥宿主水平→M3 域内取权评审（上游卷三 §7）"]
  exception_budget: "门禁等级调整须引用 UCSS 第7章基线+修正因子并注明理由；观察期≥1迭代方可升档"
  demotion_signal: "等级调整无理由标注频次超标→校准基线表，不放宽门禁纪律"

decided_by: "Nova（META 判型门首跑 · V1.7 接入会话）"
decided_at: "2026-09-29T18:30:00+08:00"
evidence_refs: ["UCSS-RULES.md 第7/8/10章", ".standards/ucss/interop/并存集成设计 §6.1/§7", "META-RULES §一"]
