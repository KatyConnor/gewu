<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    @page { size: 794px 1123px; margin: 0; }
    :root {
      --c-bg: #0a1628;
      --c-accent: #4da8da;
      --c-text: #e8f0f8;
      --c-muted: #7a9bb8;
      --c-glow: #2d7ab3;
    }
    html, body { margin: 0; padding: 0; width: 794px; height: 1123px; background: var(--c-bg); color: var(--c-text); font-family: 'Noto Sans SC', sans-serif; }
    @media screen {
      html { height: auto; display: flex; justify-content: center; min-height: 100vh; background: var(--c-bg); }
      body { transform-origin: top center; scale: min(1, calc(100vw / 794), calc(100vh / 1123)); margin: 0 auto; box-shadow: 0 0 60px rgba(0,0,0,0.3); }
    }
    .cover { width: 794px; height: 1123px; position: relative; box-sizing: border-box; }

    /* Layer 1 - 背景光晕（约束在画布内，防 scrollWidth 膨胀） */
    .glow-a { position: absolute; left: 40%; top: 8%; width: 55%; height: 40%;
      background: radial-gradient(ellipse at center, rgba(45,122,179,0.28), transparent 70%);
      pointer-events: none; }
    .glow-b { position: absolute; left: 5%; top: 62%; width: 50%; height: 35%;
      background: radial-gradient(ellipse at center, rgba(77,168,218,0.14), transparent 70%);
      pointer-events: none; }
    /* 细网格（工程感） */
    .grid { position: absolute; inset: 0;
      background-image: linear-gradient(rgba(77,168,218,0.045) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(77,168,218,0.045) 1px, transparent 1px);
      background-size: 56px 56px; pointer-events: none; }
    /* 边框 */
    .frame { position: absolute; inset: 44px; border: 1px solid rgba(77,168,218,0.30);
      pointer-events: none; }

    .content { position: absolute; inset: 0; }
    .kicker { position: absolute; left: 120px; top: 128px;
      font-size: 11pt; color: var(--c-accent); letter-spacing: 6px; }
    .title { position: absolute; left: 120px; top: 185px;
      font-family: 'Noto Serif SC', serif; font-weight: 900;
      font-size: 39pt; line-height: 1.32; color: var(--c-text); }
    .subtitle { position: absolute; left: 120px; top: 475px;
      font-size: 15pt; color: var(--c-accent); letter-spacing: 2px; font-weight: 400; }
    .summary { position: absolute; left: 120px; top: 545px;
      font-size: 13pt; line-height: 1.75; color: var(--c-muted); max-width: 520px; }
    .meta-block { position: absolute; left: 120px; top: 790px; }
    .meta-line { display: block; margin-bottom: 18px; font-size: 12pt; color: var(--c-text); }
    .meta-label { color: var(--c-muted); font-size: 10pt; letter-spacing: 2px; margin-right: 18px; }
    .org { position: absolute; left: 120px; top: 928px; font-size: 15pt; color: var(--c-text); letter-spacing: 3px; }
    .date { position: absolute; left: 120px; top: 990px;
      font-size: 10pt; color: var(--c-muted); letter-spacing: 3px; }
  </style>
</head>
<body>
  <div class="cover">
    <div class="glow-a"></div>
    <div class="glow-b"></div>
    <div class="grid"></div>
    <div class="frame"></div>
    <div class="content">
      <div class="kicker">__KICKER__</div>
      <div class="title">__TITLE__</div>
      <div class="subtitle">__SUBTITLE__</div>
      <div class="summary">__SUMMARY__</div>
      <div class="meta-block">
        <span class="meta-line"><span class="meta-label">__META_L1__</span>__META_V1__</span>
        <span class="meta-line"><span class="meta-label">__META_L2__</span>__META_V2__</span>
      </div>
      <div class="org">__ORG__</div>
      <div class="date">__DATE__</div>
    </div>
  </div>
</body>
</html>
