# golangci-lint — Go lint（v2 配置格式）
# https://golangci-lint.run/usage/configuration/
# v2 变更：version 必填；run.timeout 已移除；linters-settings→linters.settings；
# issues.exclude-rules→linters.exclusions.rules

version: "2"

linters:
    default: none
    enable:
        - errcheck        # 检查未处理的 error
        - govet           # go vet
        - staticcheck     # 静态分析
        - gocritic        # 代码改进建议
        - revive          # golint 替代
        - gofmt           # 格式检查
        - goimports       # 导入排序
        - misspell        # 拼写检查
        - gocyclo         # 圈复杂度
        - dupl            # 重复代码检测
        - goconst         # 常量提取建议
        - unconvert       # 不必要的类型转换
        - prealloc        # slice 预分配建议
        - nolintlint      # nolint 注释检查
        - bodyclose       # HTTP Body close 检查
        - rowserrcheck    # sql.Rows.Err 检查
        - sqlclosecheck   # sql.Rows/Stmt close 检查
        - gosec           # 安全检查
    settings:
        gocyclo:
            min-complexity: 15
        gocritic:
            enabled-tags:
                - performance
                - style
                - experimental
        revive:
            severity: warning
            rules:
                - name: exported
                  disabled: false
                - name: var-naming
                  disabled: false
        gosec:
            excludes:
                - G104  # unhandled errors (errcheck covers)
    exclusions:
        rules:
            - path: _test\.go
              linters:
                  - gosec
                  - gocyclo
                  - errcheck

issues:
    max-issues-per-linter: 0
    max-same-issues: 0
