server:
  port: 8082

spring:
  profiles:
    active: dev

  datasource:
    url: jdbc:mysql://localhost:3306/gewu_dev?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: gewu
    password: gewu123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 3
      maximum-pool-size: 10
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000

  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 5000ms

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

  # 文件上传限制（Docker cp 通道沙箱侧入站，Spring 默认单文件 1MB 会截断大文件）
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 120MB

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.gewu.domain
  global-config:
    db-config:
      id-type: ASSIGN_UUID
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

gewu:
  sandbox:
    internal-api-key: ${GEWU_INTERNAL_API_KEY:gewu-dev-internal-key-change-me}
    docker:
      host: unix:///var/run/docker.sock
    defaults:
      cpu: 1
      memory-mb: 512
      disk-mb: 1024
      timeout-seconds: 300
      image: gewu/sandbox-base:latest
      network-enabled: false
    registry:
      url: ${REGISTRY_URL:}
      username: ${REGISTRY_USERNAME:}
      password: ${REGISTRY_PASSWORD:}
      repository: gewu/sandbox
    lifecycle:
      idle-timeout-minutes: 30
      auto-stop-enabled: true
      manual-ttl-days: 7
      project-ttl-days: 0
      agent-max-lifetime-seconds: 300
    dev:
      image: ${GEWU_DEV_IMAGE:gewu/dev-base:latest}
      cpu: 2
      memory-mb: 4096
      disk-mb: 20480
      network-enabled: true
      # dev 沙箱空闲阈值（SandboxScheduler 按 source 分档读取；误导性的 manual-ttl-days 死配置已移除）
      idle-timeout-minutes: 120
  crypto:
    api-key-secret: ${GEWU_CRYPTO_API_KEY_SECRET:13b4a0eab2f1f1093f87d0552fddca1f}

logging:
  level:
    root: INFO
    com.gewu: DEBUG
  pattern:
    dateformat: yyyy-MM-dd HH:mm:ss.SSS
