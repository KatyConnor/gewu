# clippy.toml — Rust lint 配置

# 圈复杂度上限
cognitive-complexity-threshold = 25

# 函数参数数量上限
too-many-arguments-threshold = 6

# 单行长度上限 (兼容 rustfmt)
max-struct-nodes = 50

# 禁止使用 todo!() 和 unimplemented!() 在生产代码
# 配合 -D warnings 使用

# 允许的 lint 级别:
# - warn: 警告但不阻止编译
# - deny: 阻止编译
# - allow: 允许

# 建议在 Cargo.toml 中配置:
# [lints.clippy]
# all = "warn"
# pedantic = "warn"
# nursery = "warn"
# cargo = "warn"
