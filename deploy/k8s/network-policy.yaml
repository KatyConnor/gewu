apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gewu-platform-network-policy
  namespace: gewu
spec:
  podSelector:
    matchLabels:
      app: gewu-platform
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # 允许来自 Ingress Controller 的流量
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
    # 允许 Prometheus 抓取
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # 允许访问 MySQL
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gewu
      ports:
        - protocol: TCP
          port: 3306
    # 允许访问 Redis
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gewu
      ports:
        - protocol: TCP
          port: 6379
    # 允许访问 DNS
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # 允许访问外部 HTTPS
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
