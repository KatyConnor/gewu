apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gewu.name" . }}-config
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "gewu.labels" . | nindent 4 }}
data:
  DB_HOST: {{ .Values.config.dbHost | quote }}
  DB_PORT: {{ .Values.config.dbPort | quote }}
  DB_NAME: {{ .Values.config.dbName | quote }}
  SPRING_DATASOURCE_URL: "jdbc:mysql://{{ .Values.config.dbHost }}:{{ .Values.config.dbPort }}/{{ .Values.config.dbName }}?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true"
  SPRING_DATA_REDIS_HOST: {{ .Values.config.redisHost | quote }}
  SPRING_DATA_REDIS_PORT: {{ .Values.config.redisPort | quote }}
  SPRING_PROFILES_ACTIVE: prod
  # SSE 多副本分布式广播与 HITL 决策回传（T5.1）
  GEWU_SSE_DISTRIBUTED: {{ .Values.config.sseDistributed | quote }}
  # 链路追踪（T4.2）
  OTEL_TRACING_ENABLED: {{ .Values.config.otel.enabled | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.config.otel.endpoint | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gewu.name" . }}-secret
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "gewu.labels" . | nindent 4 }}
type: Opaque
stringData:
  SPRING_DATASOURCE_PASSWORD: {{ .Values.secret.mysqlPassword | quote }}
  GEWU_SECURITY_JWT_SECRET: {{ .Values.secret.jwtSecret | quote }}
  GEWU_CRYPTO_API_KEY_SECRET: {{ .Values.secret.sm4Key | quote }}
  AI_API_KEY: {{ .Values.secret.aiApiKey | quote }}
