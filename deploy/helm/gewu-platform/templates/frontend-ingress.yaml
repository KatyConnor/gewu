# 前端（Next.js）
{{- if .Values.frontend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gewu.name" . }}-frontend
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "gewu.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: gewu-platform
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gewu-platform
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - containerPort: 3000
          resources:
            requests: {{ toYaml .Values.frontend.resources.requests | nindent 14 }}
            limits: {{ toYaml .Values.frontend.resources.limits | nindent 14 }}
          readinessProbe:
            tcpSocket: { port: 3000 }
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gewu.name" . }}-frontend
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "gewu.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: gewu-platform
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: frontend
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: 3000
      name: http
{{- end }}
---
# 入口：Ingress 按路径分流（SSE 禁缓冲注解见 values.ingress.annotations）
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "gewu.name" . }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "gewu.labels" . | nindent 4 }}
  annotations:
{{ toYaml .Values.ingress.annotations | indent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "gewu.name" . }}-{{ if .Values.gateway.enabled }}gateway{{ else }}interface{{ end }}
                port:
                  number: {{ if .Values.gateway.enabled }}{{ .Values.gateway.service.port }}{{ else }}{{ .Values.interface.service.port }}{{ end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "gewu.name" . }}-frontend
                port:
                  number: {{ .Values.frontend.service.port }}
{{- end }}
