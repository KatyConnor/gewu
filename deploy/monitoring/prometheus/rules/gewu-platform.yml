groups:
  - name: gewu-platform.rules
    rules:
      # Pod 重启告警
      - alert: PodFrequentlyRestarting
        expr: increase(kube_pod_container_status_restarts_total{namespace="gewu"}[5m]) > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Pod {{ $labels.pod }} 频繁重启"
          description: "Pod 在过去 5 分钟内重启了 {{ $value }} 次"

      # P95 延迟告警
      - alert: HighP95Latency
        expr: histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket{namespace="gewu"}[5m])) by (le)) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "API P95 延迟过高"
          description: "P95 延迟为 {{ $value }}s，超过 500ms 阈值"

      # 限流拒绝率告警
      - alert: HighRateLimitRejection
        expr: sum(rate(api_rate_limit_exceeded_total{namespace="gewu"}[10m])) / sum(rate(http_server_requests_seconds_count{namespace="gewu"}[10m])) > 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "限流拒绝率过高"
          description: "限流拒绝率为 {{ $value | humanizePercentage }}"

      # 数据库健康检查失败
      - alert: DatabaseHealthCheckFailed
        expr: db_health_check_failed_total{namespace="gewu"} > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "数据库健康检查失败"
          description: "数据库连接池异常，请检查数据库状态"

      # JVM 内存使用率告警
      - alert: HighMemoryUsage
        expr: jvm_memory_used_bytes{namespace="gewu", area="heap"} / jvm_memory_max_bytes{namespace="gewu", area="heap"} > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "JVM 堆内存使用率过高"
          description: "堆内存使用率为 {{ $value | humanizePercentage }}"

      # 磁盘空间告警
      - alert: LowDiskSpace
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "磁盘空间不足"
          description: "磁盘可用空间低于 10%"

      # ===== Agent 引擎业务告警（T4.2） =====

      # 预算熔断：5 分钟内出现即告警（认知任务成本失控或任务过重）
      - alert: AgentBudgetExceeded
        expr: increase(agent_budget_exceeded_total[5m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Agent 预算熔断"
          description: "5 分钟内发生 {{ $value }} 次预算熔断（token/时间超限终止），检查任务复杂度分级与预算配置"

      # 慢 LLM 调用：任务时长 P95 超 30 秒
      - alert: SlowAgentTask
        expr: histogram_quantile(0.95, sum(rate(agent_task_duration_seconds_bucket[5m])) by (le)) > 30
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Agent 任务执行过慢"
          description: "任务时长 P95 超过 30 秒，检查模型供应商延迟或工具调用轮次"

      # 语义缓存命中率过低：近 1 小时命中率 < 10%（QA 场景成本优化失效信号）
      - alert: LowSemanticCacheHitRate
        expr: |
          sum(rate(agent_cache_hit_total[1h])) /
          (sum(rate(agent_cache_hit_total[1h])) + sum(rate(agent_cache_miss_total[1h]))) < 0.10
        for: 30m
        labels:
          severity: info
        annotations:
          summary: "语义缓存命中率过低"
          description: "近 1 小时命中率低于 10%，确认缓存适配器（pgvector 阈值/TTL）配置"
